---
layout: default
---
<main id="main" class="post-main">
  <article class="post">
    <a class="back-link" href="{{ '/' | relative_url }}">← На главную</a>
    <header class="post-header">
      <time class="eyebrow" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%d.%m.%Y' }}</time>
      <h1>{{ page.title | escape }}</h1>
    </header>
    <div class="prose">{{ content }}</div>
  </article>
</main>
